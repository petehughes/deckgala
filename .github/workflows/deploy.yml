name: Deploy Production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Zero-Downtime Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run --filter @aquateamhub/database db:generate

      - name: Build Next.js applications
        env:
          NEXT_PUBLIC_AUTH_URL: https://auth.aquateamhub.com
          NEXT_PUBLIC_API_URL: https://api.aquateamhub.com
          NEXT_PUBLIC_SITE_URL: https://www.aquateamhub.com
        run: |
          for a in auth my myclub results www; do
            bun run --filter @aquateamhub/$a build
          done

      - name: Package release artifact
        run: |
          tar -czf release-${{ github.sha }}.tar.gz \
            apps packages node_modules package.json bun.lock*

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer release to server
        run: |
          scp release-${{ github.sha }}.tar.gz ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/

      - name: Extract & Activate on server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -euo pipefail
            RELEASE_DIR="/srv/aquateamhub/releases/${{ github.sha }}"
            sudo -u aquateamhub mkdir -p "$RELEASE_DIR"
            sudo -u aquateamhub tar -xzf "/tmp/release-${{ github.sha }}.tar.gz" -C "$RELEASE_DIR"
            rm -f "/tmp/release-${{ github.sha }}.tar.gz"
            sudo -u aquateamhub /srv/aquateamhub/activate-release.sh "${{ github.sha }}"
          EOF

