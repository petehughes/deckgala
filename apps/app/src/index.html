<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AquaTeamHub — Offline Deck Timing &amp; Swim Meet Management</title>
  <meta name="description" content="AquaTeamHub empowers swimming clubs with cable-free, multi-device pool deck timing, wave launch intervals, and instant gala competition management." />
  <meta name="theme-color" content="#0B1528" />
  <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />

<body>
  <div id="root">
    <!-- Instant Splash Screen on app open -->
    <div class="splash-overlay" id="pre-splash">
      <div class="splash-content">
        <div class="splash-logo-container">
          <img src="./assets/logo.svg" alt="AquaTeamHub Logo" class="splash-logo-img" width="84" height="84" />
        </div>
        <h1 class="splash-title">AquaTeamHub</h1>
        <p class="splash-tagline">Offline deck timing. Seamless meet management.</p>
        <div class="splash-loading-bar" aria-hidden="true">
          <div class="splash-loading-fill"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.tsx"></script>
